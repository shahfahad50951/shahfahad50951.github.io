<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SF">
  <style>
    .bg { fill: #09090b; }
    .border { stroke: #2f343b; }
    .letters { fill: #f4f0e8; }
    .dot { fill: #8fc7c3; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f7f7f4; }
      .border { stroke: #d4d4d8; }
      .letters { fill: #18181b; }
      .dot { fill: #2563eb; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <rect class="border" x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke-width="3"/>
  <text
    x="31.5"
    y="39.5"
    class="letters"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif"
    font-size="24"
    font-weight="700"
    letter-spacing="-1"
    text-anchor="middle"
  >SF</text>
  <circle class="dot" cx="50" cy="49" r="3.5"/>
</svg>
